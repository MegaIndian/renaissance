packages:
  - apps/*
  - packages/*
nodeLinker: hoisted
allowBuilds:
  esbuild: true
# Each line below is a version the lockfile already holds that is younger than minimumReleaseAge at
# the time of writing (all published 2026-11-17, mature on 2026-11-18 after 12:45 UTC). Without the
# line, `pnpm install` refuses the lockfile. Delete the line once that time has passed. The two
# @tanstack entries that used to be here named a version not in the lockfile and are gone.
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.21' # expo 58.0.26 depends on it; published 2026-11-17 12:04 UTC
  - '@expo/metro-config@58.0.23' # same, 12:03 UTC
  - '@expo/router-server@58.0.23' # same, 11:59 UTC
  - babel-preset-expo@58.0.26 # same, 12:00 UTC
  - expo-file-system@58.0.14 # same, 12:00 UTC
  - expo-router@58.0.32 # apps/mobile pins it; 12:04 UTC
  - expo@58.0.26 # apps/mobile pins it; 12:01 UTC
  - i18next@27.1.5 # core and mobile depend on it; 12:42 UTC
# Supply-chain policy: a package must be at least a day old before it is installed (pnpm default, made explicit).
minimumReleaseAge: 1440
# `pnpm audit --audit-level high` runs in CI. Advisories listed here are known and unpatched upstream:
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7 (via vite/tinyglobby, vitest, metro/jest-util): no patched version yet.
    # Build-time glob matching only; revisit when a fix is released.
    - GHSA-fc5q-39xc-vjpf

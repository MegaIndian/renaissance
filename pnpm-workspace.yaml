packages:
  - apps/*
  - packages/*
nodeLinker: hoisted
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.21'
  - '@expo/metro-config@58.0.23'
  - '@expo/router-server@58.0.23'
  - '@tanstack/react-query@5.108.0'
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo-router@58.0.32
  - expo@58.0.26
  - i18next@27.1.5
  - '@tanstack/query-core@5.108.0'
# Supply-chain policy: a package must be at least a day old before it is installed (pnpm default, made explicit).
minimumReleaseAge: 1440

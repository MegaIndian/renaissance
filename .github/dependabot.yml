version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns: ['expo*', 'react-native*', '@expo/*']
      react:
        patterns: ['react', 'react-dom', '@types/react*', 'react-router*', '@tanstack/*']
      tooling:
        patterns:
          [
            'eslint*',
            'typescript*',
            'prettier',
            'vitest',
            'turbo',
            '@commitlint/*',
            '@changesets/*',
            'husky',
            'lint-staged',
          ]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
  - package-ecosystem: docker
    directory: /docker/demo
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(demo)'

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns: ['expo*', 'react-native*', '@expo/*']
      react:
        patterns: ['react', 'react-dom', '@types/react*', 'react-router*', '@tanstack/*']
      tooling:
        patterns:
          [
            'eslint*',
            'typescript*',
            'prettier',
            'vitest',
            '@vitest/*',
            'turbo',
            '@commitlint/*',
            '@changesets/*',
            'husky',
            'lint-staged',
          ]
    ignore:
      # TypeScript majors wait for typescript-eslint, tsx and Expo to support them (closed #7).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The repo runs Node 22 (.nvmrc, engines, the hub image); types stay on 22 (closed #8).
      - dependency-name: '@types/node'
        versions: ['>=23']
      # Expo SDK 58 pins these (expo/bundledNativeModules.json) and CI runs `expo install --check`, so any
      # other version fails. They move with the SDK, by hand (closed #15, #16). react and react-dom are
      # shared with apps/web, whose copy moves at the same time.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-worklets
      - dependency-name: react-native-svg
      - dependency-name: '@react-native-async-storage/async-storage'
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
  # docker/demo holds a compose file, not a Dockerfile.
  - package-ecosystem: docker-compose
    directory: /docker/demo
    schedule:
      interval: weekly
    ignore:
      # docker/demo/jellyfin-setup.mjs drives the 10.10 Startup API; a Jellyfin major is a deliberate
      # upgrade with a live run against the new image, not a bot bump (closed #11).
      - dependency-name: jellyfin/jellyfin
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(demo)'
  - package-ecosystem: docker
    directory: /apps/hub
    schedule:
      interval: weekly
    ignore:
      # The repo runs Node 22 (.nvmrc, engines, @types/node); the image follows when they move (closed #10).
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'build(hub)'

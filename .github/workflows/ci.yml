name: CI

on:
  pull_request:
  # Release calls this workflow on every push to main and on tags, so a push trigger here would run
  # it twice; the required `CI` check on a pull request comes from the pull_request run.
  workflow_call:
  # Manual runs on any branch from the Actions tab or `gh workflow run ci.yml --ref <branch>`. Such a
  # run does not appear on a pull request's checks, so it cannot stand in for the pull_request run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  TURBO_TELEMETRY_DISABLED: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Audit (high and above; allowlist in pnpm-workspace.yaml)
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Typecheck (core, design, web, hub)
        run: pnpm typecheck --filter=!mobile
      - name: Typecheck (mobile)
        run: pnpm --filter mobile typecheck
      - name: Expo SDK versions (apps/mobile stays on what expo@58 pins; fails on any drift)
        run: pnpm --filter mobile exec expo install --check
      - name: Test (coverage floor 80 % on core and hub)
        run: pnpm test
      - name: Build web
        run: pnpm --filter web build
      - name: Shell bundle budget (200 kB gzipped first load)
        run: pnpm --filter web size
      - name: Browser tests (accessibility in Chromium; the Jellyfin suite skips here, see docs/testing.md)
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web e2e
      - name: Build hub
        run: pnpm --filter hub build
      - name: Hub smoke test (the version in /health is the manifest's)
        run: |
          node apps/hub/dist/server.js &
          expected="$(node -p "require('./apps/hub/package.json').version")"
          for i in $(seq 1 15); do
            if body="$(curl --fail --silent http://127.0.0.1:8787/health)"; then ok=1; break; fi
            sleep 1
          done
          test "${ok:-0}" = 1
          echo "$body"
          echo "$body" | grep -F "\"version\":\"$expected\""
          kill %1
      - name: Build hub image
        run: docker build -f apps/hub/Dockerfile -t renaissance-hub:ci .
      - name: Hub image smoke test (same version check inside the image)
        run: |
          docker run -d --name hub -p 8788:8787 renaissance-hub:ci
          expected="$(node -p "require('./apps/hub/package.json').version")"
          for i in $(seq 1 15); do
            if body="$(curl --fail --silent http://127.0.0.1:8788/health)"; then ok=1; break; fi
            sleep 1
          done
          docker logs hub
          docker rm -f hub
          test "${ok:-0}" = 1
          echo "$body" | grep -F "\"version\":\"$expected\""

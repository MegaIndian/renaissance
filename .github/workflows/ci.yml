name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'phase-*']
  # Release calls this workflow so a tagged release is re-tested before anything is published.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  TURBO_TELEMETRY_DISABLED: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Audit (high and above; allowlist in pnpm-workspace.yaml)
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Typecheck (core, design, web, hub)
        run: pnpm typecheck --filter=!mobile
      - name: Typecheck (mobile)
        run: pnpm --filter mobile typecheck
      - name: Test (coverage floor 80 % on core and hub)
        run: pnpm test
      - name: Build web
        run: pnpm --filter web build
      - name: Build hub
        run: pnpm --filter hub build
      - name: Hub smoke test
        run: |
          node apps/hub/dist/server.js &
          sleep 2
          curl --fail --silent http://127.0.0.1:8787/health
          kill %1
      - name: Build hub image
        run: docker build -f apps/hub/Dockerfile -t renaissance-hub:ci .
      - name: Hub image smoke test
        run: |
          docker run -d --name hub -p 8788:8787 renaissance-hub:ci
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8788/health; then ok=1; break; fi
            sleep 1
          done
          docker logs hub
          docker rm -f hub
          test "${ok:-0}" = 1

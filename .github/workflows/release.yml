name: Release

on:
  push:
    branches: [main]
    tags: ['v*', 'phase-*']
  # Publish the hub image from any branch by hand (a review build: the tag is the input).
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag for ghcr.io/megaindian/renaissance-hub (letters, digits, dots, dashes)'
        required: true
        default: 'preview'

# Workflow-wide: what the version PR needs. The image job alone adds `packages: write`.
permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: 0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Changesets version PR
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: pnpm version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The version PR's own CI run is held for approval because its author is github-actions[bot]
      # (GITHUB_TOKEN). A dispatched run on the branch was tried (phase-0.1): it ran green but GitHub
      # does not list workflow_dispatch runs on a pull request, so it never satisfied the required
      # `CI` check. Until the PR is opened with a GitHub App or fine-grained PAT token, a maintainer
      # presses "Approve and run" on the held run once per version PR (CONTRIBUTING, Releases).

  image:
    # The deploy path: TrueNAS pulls this image (docker/hub/compose.yml pins a tag). Every `v*` and
    # `phase-*` tag publishes `:<tag>`, every push to main publishes `:edge`, a dispatch publishes the
    # tag it was given. Nothing here is `:latest`, so a redeploy never changes under a pinned compose.
    name: Hub image to GHCR
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/megaindian/renaissance-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        # The dispatch input reaches the shell through the environment, never by interpolation.
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) tag="$IMAGE_TAG" ;;
            *) if [[ "${GITHUB_REF}" == refs/tags/* ]]; then tag="${GITHUB_REF_NAME}"; else tag="edge"; fi ;;
          esac
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then echo "bad tag: $tag" >&2; exit 1; fi
          echo "tags=${IMAGE}:${tag},${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/hub/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A software bill of materials and full build provenance ride with every image.
          sbom: true
          provenance: mode=max
      - name: Smoke test the pushed image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          first="$(echo "$TAGS" | cut -d, -f1)"
          docker run -d --name hub -p 8788:8787 "$first"
          expected="$(node -p "require('./apps/hub/package.json').version")"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/health | grep -q "\"version\":\"$expected\""; then echo "hub $expected up"; exit 0; fi
            sleep 1
          done
          docker logs hub; exit 1

  release:
    name: GitHub release with web build
    if: startsWith(github.ref, 'refs/tags/')
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Zip web build
        run: |
          cd apps/web/dist
          zip -r "../../../renaissance-web-${GITHUB_REF_NAME}.zip" .
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "renaissance-web-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --prerelease

name: Release

on:
  push:
    branches: [main]
    tags: ['v*', 'phase-*']

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: 0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  version:
    name: Changesets version PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: GitHub release with web build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Zip web build
        run: |
          cd apps/web/dist
          zip -r "../../../renaissance-web-${GITHUB_REF_NAME}.zip" .
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "renaissance-web-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --prerelease

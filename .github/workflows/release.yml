name: Release

on:
  push:
    branches: [main]
    tags: ['v*', 'phase-*']

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: 0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Changesets version PR
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: pnpm version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The version PR's own CI run is held for approval because its author is github-actions[bot]
      # (GITHUB_TOKEN). A dispatched run on the branch was tried (phase-0.1): it ran green but GitHub
      # does not list workflow_dispatch runs on a pull request, so it never satisfied the required
      # `CI` check. Until the PR is opened with a GitHub App or fine-grained PAT token, a maintainer
      # presses "Approve and run" on the held run once per version PR (CONTRIBUTING, Releases).

  release:
    name: GitHub release with web build
    if: startsWith(github.ref, 'refs/tags/')
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Zip web build
        run: |
          cd apps/web/dist
          zip -r "../../../renaissance-web-${GITHUB_REF_NAME}.zip" .
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "renaissance-web-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --prerelease

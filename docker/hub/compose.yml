# Renaissance Hub on TrueNAS SCALE as a custom app (Apps, Discover, Custom App, "Install via YAML").
# Host paths follow the server's rule: app data under /mnt/HDDs/files/apps/<app>/. Every value below
# that is a placeholder (<...>) is set in the TrueNAS form; secrets never live in this file.
#
# The hub needs to see the slskd completed-downloads folder at the same path Lidarr sees it, so
# RENAISSANCE_LIDARR_DOWNLOADS_DIR is the path *inside Lidarr's container* (on Main-HUB:
# /files/downloads/music/complete). The hub itself never touches the files; Lidarr moves them.
services:
  renaissance-hub:
    image: ghcr.io/megaindian/renaissance-hub:latest
    # Or build from a checkout:  docker build -f apps/hub/Dockerfile -t renaissance-hub .
    container_name: renaissance-hub
    restart: unless-stopped
    user: '568:568'
    ports:
      - '30878:8787'
    volumes:
      - /mnt/HDDs/files/apps/renaissance-hub:/data
    environment:
      NODE_ENV: production
      RENAISSANCE_HUB_PORT: '8787'
      RENAISSANCE_HUB_DB: /data/hub.sqlite
      # The web app's origin(s), comma separated; the hub answers browsers from nowhere else.
      RENAISSANCE_HUB_CORS_ORIGINS: https://music.<tailnet>.ts.net
      # Set when a reverse proxy (Tailscale Serve, nginx) sits in front, so the rate limit sees clients.
      RENAISSANCE_HUB_TRUST_PROXY: 'true'
      # Jellyfin user names or ids that may see the whole house; empty means Jellyfin administrators.
      RENAISSANCE_HUB_ADMINS: sahil
      # Monthly model spend in US dollars; the Ask bar falls back to library search when reached.
      RENAISSANCE_BUDGET_USD_MONTH: '10'
      # The hub reaches the other apps over the LAN; keys come from each app's settings page.
      JELLYFIN_URL: http://192.168.87.196:8096
      JELLYFIN_API_KEY: <jellyfin api key>
      LIDARR_URL: http://192.168.87.196:30071
      LIDARR_API_KEY: <lidarr api key>
      LIDARR_ROOT_FOLDER: /files/media/music
      RENAISSANCE_LIDARR_DOWNLOADS_DIR: /files/downloads/music/complete
      SLSKD_URL: http://192.168.87.196:30336
      SLSKD_API_KEY: <slskd api key>
      NAVIDROME_URL: http://192.168.87.196:30043
      NAVIDROME_USER: <navidrome user>
      NAVIDROME_PASSWORD: <navidrome password>
      # Optional: without it the Ask bar still answers from the library, with model: "off".
      ANTHROPIC_API_KEY: <anthropic api key>
      ANTHROPIC_INTENT_MODEL: claude-opus-5-5
      # Sent to MusicBrainz in the User-Agent, as its etiquette asks.
      RENAISSANCE_CONTACT: <an email or project url>
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
